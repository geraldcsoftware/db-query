# GoReleaser configuration for db-query.
# Reference: https://goreleaser.com
version: 2

project_name: db-query

before:
  hooks:
    - go mod tidy

# The SQL classifier links PostgreSQL's own grammar (pg_query_go), which is
# cgo. That rules out the previous CGO_ENABLED=0 cross-compile from Linux, so
# these builds run on macOS and are split per architecture: cgo needs the
# target architecture passed to the C compiler as well as to Go.
#
# One Apple Silicon runner covers both, because the Xcode SDK carries an
# x86_64 slice, so `clang -arch x86_64` cross-compiles the C half natively.
#
# A binary built this way is dynamically linked against the system libSystem,
# which is present on every supported macOS, so the Homebrew formula is
# unaffected. What is lost is the fully static binary the CGO_ENABLED=0 build
# produced.
builds:
  - id: db-query-arm64
    main: ./cmd/db-query
    binary: db-query
    env:
      - CGO_ENABLED=1
      - CC=clang
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

  - id: db-query-amd64
    main: ./cmd/db-query
    binary: db-query
    env:
      - CGO_ENABLED=1
      - CC=clang -arch x86_64
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: db-query
    ids:
      - db-query-arm64
      - db-query-amd64
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: db-query
    # Publish into Formula/ (Homebrew's convention, matching the rest of the
    # tap) rather than the tap root.
    directory: Formula
    repository:
      owner: geraldcsoftware
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/geraldcsoftware/db-query"
    description: "Run SQL against configured hosts via native database clients"
    # A formula installs the pre-built binary into the Homebrew prefix, which is
    # exempt from Gatekeeper quarantine — so no xattr workaround is needed — and
    # generates the zsh completion at install time so `brew install` sets it up.
    install: |
      bin.install "db-query"
      generate_completions_from_executable(bin/"db-query", "completion", shells: [:zsh])
    test: |
      system "#{bin}/db-query", "version"
