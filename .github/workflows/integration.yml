name: integration

on:
  # Nightly rather than on every pull request: these tests pull a SQL Server
  # image measured in gigabytes, and they need Docker, which the macOS runners
  # in ci.yml do not provide. Scheduled runs only ever fire on the default
  # branch, so this is a check on main, not on open work.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # Opt-in per pull request: label it "integration" and this runs, on that
  # push and on every push after it. Unlabelled pull requests skip the job
  # entirely and pay nothing.
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # db-query drives the real clients rather than a Go driver, so the
      # runner needs them on PATH, not just the containers. psql ships with
      # the image; sqlcmd does not. go-sqlcmd is the build this adapter's
      # flags were verified against (see the -y 0 note in
      # internal/adapter/sqlserver.go), and installing it through the
      # toolchain set up above beats pinning an OS codename or a release
      # asset name, both of which move without notice. Pinned rather than
      # @latest: a nightly that reports on main should not also be the first
      # thing to find out an upstream release is broken.
      - name: Install sqlcmd
        run: |
          # An explicit GOBIN rather than wherever the default resolves to,
          # so the rename below has one known target and nothing lands in
          # the working tree.
          export GOBIN="$RUNNER_TEMP/db-clients"
          go install github.com/microsoft/go-sqlcmd/cmd/modern@v1.10.0
          # The adapter execs "sqlcmd"; the module names its binary after
          # the package it lives in.
          mv "$GOBIN/modern" "$GOBIN/sqlcmd"
          echo "$GOBIN" >> "$GITHUB_PATH"

      # Before the databases, not after: without a client the suite's
      # three-minute readiness wait cannot pass, and when it gives up it
      # blames the container stack rather than the missing binary. Asserting
      # the prerequisite here costs a second and names the real cause.
      - name: Check the clients are on PATH
        run: |
          missing=""
          for client in psql sqlcmd; do
            command -v "$client" >/dev/null 2>&1 || missing="$missing $client"
          done
          if [ -n "$missing" ]; then
            echo "Not on PATH:$missing" >&2
            echo "The integration suite drives the real clients; see README.md." >&2
            exit 1
          fi
          psql --version
          sqlcmd --version

      # --wait holds until both containers report healthy, so a slow SQL
      # Server start fails here with a clear cause rather than as a connection
      # refused inside the first test.
      - name: Start the databases
        run: docker compose -f integration/docker-compose.yml up -d --wait

      # Same invocation as `make integration-test`, so a failure here
      # reproduces locally with one command and no translation.
      - name: Run the integration suite
        run: go test -tags integration -count=1 -timeout 15m -v ./integration/...

      - name: Container logs
        if: failure()
        run: docker compose -f integration/docker-compose.yml logs --no-color

      - name: Stop the databases
        if: always()
        run: docker compose -f integration/docker-compose.yml down -v
