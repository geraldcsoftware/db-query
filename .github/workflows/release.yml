name: release

on:
  push:
    tags:
      - "v*"

permissions:
  # Required for GoReleaser to create the GitHub Release on this repository.
  contents: write

jobs:
  goreleaser:
    # macOS, not ubuntu: the SQL classifier links PostgreSQL's own grammar,
    # which is cgo, and cgo cannot be cross-compiled to darwin from Linux. The
    # runner is Apple Silicon and builds the amd64 slice through
    # `clang -arch x86_64`, which the Xcode SDK supports natively.
    runs-on: macos-latest
    # The actions below are on their v7 line, which targets the node24
    # runtime rather than the deprecated node20. v7 requires a runner of
    # at least v2.327.1, which the hosted macOS image provides.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and all tags to compute the
          # version and build the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # Fail here rather than part-way through a release if the cgo toolchain
      # is not what this workflow assumes. Both slices are built for real, so a
      # missing x86_64 SDK slice surfaces before any tag is published.
      - name: Verify the cgo toolchain builds both slices
        run: |
          set -euo pipefail
          CGO_ENABLED=1 CC=clang \
            go build -o /dev/null ./cmd/db-query
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" \
            go build -o /dev/null ./cmd/db-query

      - name: Test
        run: CGO_ENABLED=1 go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Creates the release on this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew formula to geraldcsoftware/homebrew-tap.
          # GITHUB_TOKEN cannot write to another repository, so this must be a
          # Personal Access Token with write access to the tap repo.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
