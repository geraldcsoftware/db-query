# Minimal throwaway databases for db-query integration tests.
# Image refs are overridable for environments that must pull through a
# registry mirror (e.g. DBQ_POSTGRES_IMAGE=mirror.gcr.io/library/postgres:16-alpine).
services:
  postgres:
    image: ${DBQ_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: dbq
      POSTGRES_PASSWORD: pg-integration-pw
      POSTGRES_DB: dbqtest
    ports:
      - "${DBQ_PG_PORT:-15432}:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbq -d dbqtest"]
      interval: 2s
      timeout: 3s
      retries: 30

  mssql:
    image: ${DBQ_MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DbQ-Integration-Pw1"
      MSSQL_PID: Developer
    ports:
      - "${DBQ_MSSQL_PORT:-11433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
